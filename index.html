
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTES KNOTs</title>
<style>
:root {
  --bg: #f8f5f1;
  --text: #45434a;
  --muted: #918d96;
  --accent: #a99bc8;
  --white: #fff;
  --shadow: 0 5px 18px rgba(70, 60, 80, .09);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 32px 20px;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", sans-serif;
}
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
.app { max-width: 1050px; margin: auto; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 28px;
}
.logo {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 1px;
}
.logo span { color: var(--accent); }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 5px; }
.primary {
  border: 0;
  border-radius: 12px;
  background: #b7a8d4;
  color: white;
  padding: 12px 20px;
  font-weight: 700;
  box-shadow: var(--shadow);
}
.primary:hover { background: #a797c8; }
.search-wrap { margin-bottom: 18px; }
.search {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #e8e1eb;
  border-radius: 13px;
  background: white;
  outline: none;
}
.search:focus, input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0 24px;
}
.tag-filter {
  border: 1px solid #e5deeb;
  border-radius: 20px;
  padding: 7px 13px;
  background: white;
  color: #77717f;
  font-size: 12px;
}
.tag-filter.active {
  background: #b7a8d4;
  border-color: #b7a8d4;
  color: white;
}
.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 18px;
}
.note {
  min-height: 190px;
  padding: 19px;
  border-radius: 3px 3px 12px 3px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
  position: relative;
  overflow-wrap: anywhere;
}
.note:hover {
  transform: translateY(-4px) rotate(-.5deg);
  box-shadow: 0 9px 22px rgba(70, 60, 80, .13);
}
.note::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 7px;
  background: rgba(255,255,255,.35);
}
.note h3 { margin: 8px 0 12px; font-size: 17px; }
.note p {
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  margin: 0 0 18px;
}
.note-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.note-tag {
  background: rgba(255,255,255,.55);
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 10px;
}
.note-date { color: #77717f; font-size: 10px; margin-top: 13px; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 65px 15px;
  grid-column: 1 / -1;
}
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(45, 40, 50, .35);
  z-index: 10;
  align-items: center;
  justify-content: center;
  padding: 18px;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: white;
  width: min(520px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 15px 50px rgba(0,0,0,.16);
}
.modal h2 { margin: 0 0 20px; font-size: 21px; }
.field { margin-bottom: 15px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #77717f;
  margin-bottom: 7px;
}
.field input, .field textarea, .field select {
  width: 100%;
  border: 1px solid #e8e1eb;
  border-radius: 10px;
  padding: 11px 12px;
  outline: none;
  background: white;
  color: var(--text);
}
.field textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
.modal-actions {
  display: flex;
  justify-content: space-between;
  gap: 9px;
  margin-top: 22px;
  flex-wrap: wrap;
}
.actions-right { display: flex; gap: 8px; margin-left: auto; }
.secondary, .danger {
  border: 0;
  border-radius: 10px;
  padding: 10px 15px;
}
.secondary { background: #f0edf3; color: #625b6b; }
.danger { background: #f8e3e5; color: #a44f5a; }
.preview-content {
  white-space: pre-wrap;
  line-height: 1.75;
  font-size: 14px;
  overflow-wrap: anywhere;
  margin: 18px 0;
}
.preview-meta { color: var(--muted); font-size: 11px; margin-top: 18px; }
.preview-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.preview-tags span {
  background: #f0edf5;
  padding: 5px 10px;
  border-radius: 15px;
  font-size: 11px;
}
@media(max-width: 550px) {
  body { padding: 22px 14px; }
  .logo { font-size: 23px; }
  .primary { padding: 10px 13px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="logo">NOTES <span>KNOTs</span></div>
      <div class="subtitle">Collect your thoughts. Tie them together.</div>
    </div>
    <button class="primary" id="addBtn">＋ New Note</button>
  </header>

  <div class="search-wrap">
    <input class="search" id="searchInput" placeholder="Search notes, tags..." autocomplete="off">
  </div>

  <div class="tags" id="tagFilters"></div>
  <main class="notes-grid" id="notesGrid"></main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <section class="modal" id="modal">
    <h2 id="modalTitle">New Note</h2>

    <div id="editFields">
      <div class="field">
        <label for="noteTitle">TITLE</label>
        <input id="noteTitle" maxlength="100" placeholder="Give your note a title">
      </div>
      <div class="field">
        <label for="noteBody">CONTENT</label>
        <textarea id="noteBody" placeholder="Write something..."></textarea>
      </div>
      <div class="field">
        <label for="noteTags">TAGS</label>
        <input id="noteTags" placeholder="e.g. ideas, work, personal">
      </div>
      <div class="field">
        <label for="noteColor">COLOR</label>
        <select id="noteColor">
          <option value="yellow">Butter Yellow</option>
          <option value="pink">Soft Pink</option>
          <option value="blue">Sky Blue</option>
          <option value="green">Mint Green</option>
          <option value="purple">Lavender</option>
        </select>
      </div>
    </div>

    <div id="previewFields" style="display:none">
      <div class="preview-content" id="previewBody"></div>
      <div class="preview-tags" id="previewTags"></div>
      <div class="preview-meta" id="previewMeta"></div>
    </div>

    <div class="modal-actions">
      <div>
        <button class="danger" id="deleteBtn" style="display:none">Delete</button>
      </div>
      <div class="actions-right">
        <button class="secondary" id="closeBtn">Close</button>
        <button class="secondary" id="editBtn" style="display:none">✎ Edit</button>
        <button class="primary" id="saveBtn">Save Note</button>
      </div>
    </div>
  </section>
</div>

<script>
const STORAGE_KEY = "stickyNotes";

const colors = {
  yellow: "#fff1a8",
  pink: "#ffdce5",
  blue: "#d8ecff",
  green: "#d9f2dc",
  purple: "#e8ddff"
};

let notes = [];
let selectedTag = "All";
let currentId = null;
let modalMode = "edit";

const $ = id => document.getElementById(id);

function loadNotes() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    notes = Array.isArray(saved) ? saved.map(note => ({
      id: note.id || Date.now() + Math.random(),
      title: note.title || "",
      body: note.body || note.content || "",
      tags: Array.isArray(note.tags) ? note.tags : [],
      color: colors[note.color] ? note.color : "yellow",
      createdAt: note.createdAt || new Date().toISOString(),
      updatedAt: note.updatedAt || note.createdAt || new Date().toISOString()
    })) : [];
  } catch {
    notes = [];
  }
}

function saveToStorage() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

function formatDate(date) {
  return new Date(date).toLocaleString("en-US", {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function render() {
  renderTags();

  const query = $("searchInput").value.toLowerCase().trim();
  const filtered = notes.filter(note => {
    const matchesTag = selectedTag === "All" || note.tags.includes(selectedTag);
    const searchable = [note.title, note.body, ...note.tags].join(" ").toLowerCase();
    return matchesTag && searchable.includes(query);
  });

  const grid = $("notesGrid");
  grid.innerHTML = "";

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty">
      <div style="font-size:30px;margin-bottom:10px">✦</div>
      <div>${notes.length ? "No matching notes found." : "Your notebook is empty."}</div>
      <div style="font-size:12px;margin-top:7px">Create a note and let your ideas gather here.</div>
    </div>`;
    return;
  }

  filtered.forEach(note => {
    const card = document.createElement("article");
    card.className = "note";
    card.style.background = colors[note.color] || colors.yellow;

    const title = document.createElement("h3");
    title.textContent = note.title || "Untitled Note";

    const body = document.createElement("p");
    body.textContent = note.body.length > 130
      ? note.body.slice(0, 130) + "..."
      : note.body;

    const tagBox = document.createElement("div");
    tagBox.className = "note-tags";
    note.tags.forEach(tag => {
      const chip = document.createElement("span");
      chip.className = "note-tag";
      chip.textContent = "#" + tag;
      tagBox.appendChild(chip);
    });

    const date = document.createElement("div");
    date.className = "note-date";
    date.textContent = "Updated " + formatDate(note.updatedAt);

    card.append(title, body, tagBox, date);
    card.addEventListener("click", () => openPreview(note.id));
    grid.appendChild(card);
  });
}

function renderTags() {
  const container = $("tagFilters");
  container.innerHTML = "";

  const allTags = [...new Set(notes.flatMap(note => note.tags))].sort();
  const tags = ["All", ...allTags];

  tags.forEach(tag => {
    const button = document.createElement("button");
    button.className = "tag-filter" + (selectedTag === tag ? " active" : "");
    button.textContent = tag === "All" ? "All Notes" : "#" + tag;
    button.addEventListener("click", () => {
      selectedTag = tag;
      render();
    });
    container.appendChild(button);
  });
}

function showModal() {
  $("modalBackdrop").classList.add("show");
}

function closeModal() {
  $("modalBackdrop").classList.remove("show");
  currentId = null;
}

function openNewNote() {
  currentId = null;
  $("noteTitle").value = "";
  $("noteBody").value = "";
  $("noteTags").value = "";
  $("noteColor").value = "yellow";
  setMode("edit");
  $("modalTitle").textContent = "New Note";
  $("deleteBtn").style.display = "none";
  showModal();
  $("noteTitle").focus();
}

function openPreview(id) {
  currentId = id;
  const note = notes.find(item => item.id === id);
  if (!note) return;

  $("previewBody").textContent = note.body || "No content.";
  $("previewTags").innerHTML = "";
  note.tags.forEach(tag => {
    const chip = document.createElement("span");
    chip.textContent = "#" + tag;
    $("previewTags").appendChild(chip);
  });

  $("previewMeta").textContent =
    "Created: " + formatDate(note.createdAt) +
    "  |  Updated: " + formatDate(note.updatedAt);

  $("modalTitle").textContent = note.title || "Untitled Note";
  $("deleteBtn").style.display = "none";
  setMode("preview");
  showModal();
}

function setMode(mode) {
  modalMode = mode;
  const editing = mode === "edit";

  $("editFields").style.display = editing ? "block" : "none";
  $("previewFields").style.display = editing ? "none" : "block";
  $("saveBtn").style.display = editing ? "inline-block" : "none";
  $("editBtn").style.display = editing ? "none" : "inline-block";
  $("modalTitle").textContent = editing ? "Edit Note" : $("modalTitle").textContent;
}

function editCurrentNote() {
  const note = notes.find(item => item.id === currentId);
  if (!note) return;

  $("noteTitle").value = note.title;
  $("noteBody").value = note.body;
  $("noteTags").value = note.tags.join(", ");
  $("noteColor").value = note.color;

  $("modalTitle").textContent = "Edit Note";
  $("deleteBtn").style.display = "inline-block";
  setMode("edit");
  $("deleteBtn").style.display = "inline-block";
}

function saveNote() {
  const title = $("noteTitle").value.trim();
  const body = $("noteBody").value.trim();
  const tags = [...new Set(
    $("noteTags").value.split(",").map(tag => tag.trim()).filter(Boolean)
  )];
  const color = $("noteColor").value;
  const now = new Date().toISOString();

  if (!title && !body) {
    alert("Please enter a title or some content.");
    return;
  }

  if (currentId !== null) {
    const note = notes.find(item => item.id === currentId);
    if (!note) return;
    note.title = title;
    note.body = body;
    note.tags = tags;
    note.color = color;
    note.updatedAt = now;
  } else {
    const newNote = {
      id: Date.now() + Math.random(),
      title,
      body,
      tags,
      color,
      createdAt: now,
      updatedAt: now
    };
    notes.unshift(newNote);
    currentId = newNote.id;
  }

  saveToStorage();
  render();
  closeModal();
}

function deleteCurrentNote() {
  if (currentId === null) return;
  if (!confirm("Are you sure you want to delete this note?")) return;

  notes = notes.filter(note => note.id !== currentId);
  saveToStorage();
  render();
  closeModal();
}

$("addBtn").addEventListener("click", openNewNote);
$("searchInput").addEventListener("input", render);
$("closeBtn").addEventListener("click", closeModal);
$("saveBtn").addEventListener("click", saveNote);
$("editBtn").addEventListener("click", editCurrentNote);
$("deleteBtn").addEventListener("click", deleteCurrentNote);

$("modalBackdrop").addEventListener("click", event => {
  if (event.target === $("modalBackdrop")) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

loadNotes();
render();
</script>
</body>
</html>
