
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOTES KNOTs</title>

<style>
:root {
  --bg: #faf8f5;
  --text: #55515b;
  --muted: #aaa4ae;
  --accent: #b7a4dc;
  --pink: #ffe0e7;
  --yellow: #fff1b9;
  --blue: #dceeff;
  --green: #ddf2df;
  --purple: #e9defb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans JP", sans-serif;
}

button {
  border: none;
  cursor: pointer;
  font: inherit;
}

/* HEADER */

header {
  padding: 30px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 1px;
}

.logo span {
  color: var(--accent);
}

.add-button {
  background: var(--accent);
  color: white;
  padding: 12px 22px;
  border-radius: 12px;
  font-weight: bold;
}

.add-button:hover {
  opacity: .8;
  transform: translateY(-2px);
}

/* MAIN */

main {
  max-width: 1200px;
  margin: auto;
  padding: 10px 5% 60px;
}

/* SEARCH */

.search-area {
  margin-bottom: 25px;
}

.search-area input {
  width: 100%;
  padding: 15px 20px;
  border: 1px solid #eee8f0;
  border-radius: 14px;
  outline: none;
  background: white;
  font-size: 15px;
}

.search-area input:focus {
  border-color: var(--accent);
}

/* TAGS */

.tag-section {
  margin-bottom: 30px;
}

.section-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: bold;
  margin-bottom: 12px;
  letter-spacing: 1px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.tag {
  padding: 7px 15px;
  border-radius: 20px;
  background: white;
  color: #88818d;
  border: 1px solid #eee8f0;
  font-size: 13px;
  transition: .2s;
}

.tag.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* NOTES GRID */

.notes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 20px;
}

.note {
  min-height: 190px;
  padding: 20px;
  border-radius: 4px 4px 12px 12px;
  position: relative;
  box-shadow: 2px 5px 12px #0000000c;
  transition: .2s;
  cursor: pointer;
  animation: appear .25s ease;
}

.note:hover {
  transform: translateY(-4px) rotate(-.5deg);
  box-shadow: 3px 9px 18px #00000012;
}

.note::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 65px;
  height: 15px;
  background: #ffffff55;
}

.yellow { background: var(--yellow); }
.pink { background: var(--pink); }
.blue { background: var(--blue); }
.green { background: var(--green); }
.purple { background: var(--purple); }

.note-title {
  font-size: 17px;
  font-weight: bold;
  margin: 5px 0 12px;
  overflow-wrap: anywhere;
}

.note-content {
  font-size: 13px;
  line-height: 1.8;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #696470;
  max-height: 110px;
  overflow: hidden;
}

.note-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 15px;
}

.note-tag {
  font-size: 11px;
  padding: 4px 9px;
  border-radius: 10px;
  background: #ffffff90;
  color: #77717c;
}

.note-date {
  font-size: 10px;
  color: #99929c;
  margin-top: 12px;
}

.empty {
  text-align: center;
  padding: 70px 10px;
  color: var(--muted);
  grid-column: 1 / -1;
}

.empty .symbol {
  font-size: 40px;
  margin-bottom: 10px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #00000055;
  justify-content: center;
  align-items: center;
  padding: 20px;
  overflow-y: auto;
}

.modal.open {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 10px 40px #00000020;
}

.modal h2 {
  margin: 0 0 20px;
  font-size: 20px;
}

/* PREVIEW */

.preview-paper {
  padding: 25px;
  border-radius: 5px 5px 12px 12px;
  min-height: 180px;
  margin-bottom: 20px;
  position: relative;
  box-shadow: 2px 5px 12px #0000000c;
}

.preview-paper::before {
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 65px;
  height: 15px;
  background: #ffffff70;
}

.preview-title {
  font-size: 21px;
  font-weight: bold;
  margin: 5px 0 18px;
  overflow-wrap: anywhere;
}

.preview-content {
  font-size: 14px;
  line-height: 2;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  min-height: 50px;
}

.preview-date {
  color: #99929c;
  font-size: 11px;
  margin-top: 20px;
}

/* FORM */

.modal label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  color: #99929c;
  margin: 15px 0 7px;
}

.modal input,
.modal textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #eee8f0;
  border-radius: 10px;
  font: inherit;
  outline: none;
  resize: vertical;
}

.modal input:focus,
.modal textarea:focus {
  border-color: var(--accent);
}

.modal textarea {
  min-height: 130px;
}

.color-options {
  display: flex;
  gap: 12px;
}

.color-option {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 3px solid white;
  outline: 1px solid #ddd;
}

.color-option.selected {
  outline: 2px solid #888;
}

.color-option.yellow { background: var(--yellow); }
.color-option.pink { background: var(--pink); }
.color-option.blue { background: var(--blue); }
.color-option.green { background: var(--green); }
.color-option.purple { background: var(--purple); }

.modal-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 25px;
}

.right-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.cancel-button {
  background: #f2f0f3;
  padding: 10px 17px;
  border-radius: 10px;
  color: #777;
}

.save-button {
  background: var(--accent);
  color: white;
  padding: 10px 22px;
  border-radius: 10px;
}

.edit-button {
  background: var(--accent);
  color: white;
  padding: 12px 25px;
  border-radius: 10px;
}

.delete-button {
  background: #ffe5e5;
  color: #c66c6c;
  padding: 10px 15px;
  border-radius: 10px;
}

button:hover {
  opacity: .82;
}

@media (max-width: 500px) {
  header {
    padding: 22px 5%;
  }

  .logo {
    font-size: 19px;
  }

  .notes-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .note {
    padding: 14px;
    min-height: 170px;
  }

  .note-title {
    font-size: 15px;
  }

  .modal-content {
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo"> NOTES <span>KNOTs</span></div>
  <button class="add-button" onclick="openModal()">
    ＋ NEW
  </button>
</header>

<main>

  <div class="search-area">
    <input
      type="search"
      id="search"
      placeholder="Search"
      oninput="renderNotes()"
    >
  </div>

  <section class="tag-section">
    <div class="section-label">TAGS</div>
    <div class="tags" id="tagList"></div>
  </section>

  <section>
    <div class="section-label">MY NOTES</div>
    <div class="notes-grid" id="notesGrid"></div>
  </section>

</main>

<!-- MODAL -->

<div class="modal" id="modal">
  <div class="modal-content">

    <h2 id="modalTitle">NEW</h2>

    <!-- PREVIEW MODE -->

    <div id="previewArea" style="display:none;">

      <div id="previewPaper" class="preview-paper yellow">

        <div id="previewTitle" class="preview-title"></div>

        <div id="previewContent" class="preview-content"></div>

        <div id="previewTags" class="note-tags"></div>

        <div id="previewDate" class="preview-date"></div>

      </div>

      <div class="modal-actions">
        <button class="cancel-button" onclick="closeModal()">
          close
        </button>

        <button class="edit-button" onclick="switchToEdit()">
          edit
        </button>
      </div>

    </div>

    <!-- EDIT MODE -->

    <div id="editArea" style="display:none;">

      <label for="titleInput">title</label>
      <input
        id="titleInput"
        placeholder="titleを入力..."
      >

      <label for="contentInput">content</label>
      <textarea
        id="contentInput"
        placeholder="ここにメモを書こう..."
      ></textarea>

      <label for="tagsInput">tag</label>
      <input
        id="tagsInput"
        placeholder="例：日常, アイデア, 仕事"
      >

    
      </small>

      <label>color</label>

      <div class="color-options">
        <button class="color-option yellow selected"
          data-color="yellow"
          onclick="selectColor('yellow')"></button>

        <button class="color-option pink"
          data-color="pink"
          onclick="selectColor('pink')"></button>

        <button class="color-option blue"
          data-color="blue"
          onclick="selectColor('blue')"></button>

        <button class="color-option green"
          data-color="green"
          onclick="selectColor('green')"></button>

        <button class="color-option purple"
          data-color="purple"
          onclick="selectColor('purple')"></button>
      </div>

      <div class="modal-actions">

        <button
          class="delete-button"
          id="deleteButton"
          onclick="deleteNote()"
          style="display:none;">
          delete
        </button>

        <div class="right-actions">

          <button
            class="cancel-button"
            onclick="cancelEdit()">
            cancel
          </button>

          <button
            class="save-button"
            onclick="saveNote()">
            keep
          </button>

        </div>
      </div>

    </div>

  </div>
</div>

<script>

// ========================
// DATA
// ========================

let notes = [];

try {
  const saved = JSON.parse(
    localStorage.getItem("stickyNotes") || "[]"
  );

  notes = Array.isArray(saved)
    ? saved.filter(n => n && typeof n === "object")
    : [];
} catch {
  notes = [];
}

// v0.1との互換性を確保
notes = notes.map(note => ({
  ...note,
  tags: Array.isArray(note.tags) ? note.tags : [],
  color: ["yellow", "pink", "blue", "green", "purple"]
    .includes(note.color) ? note.color : "yellow",
  createdAt: note.createdAt || note.updatedAt || Date.now(),
  updatedAt: note.updatedAt || Date.now()
}));

let selectedTag = "ALL";
let selectedColor = "yellow";
let editingId = null;
let originalNote = null;

function saveData() {
  localStorage.setItem(
    "stickyNotes",
    JSON.stringify(notes)
  );
}

// ========================
// TAG MANAGEMENT
// ========================

function getAllTags() {
  const tags = new Set();

  notes.forEach(note => {
    note.tags.forEach(tag => tags.add(tag));
  });

  return [...tags].sort((a, b) =>
    a.localeCompare(b, "ja")
  );
}

function renderTags() {
  const container = document.getElementById("tagList");
  const tags = ["ALL", ...getAllTags()];

  container.innerHTML = "";

  tags.forEach(tag => {
    const button = document.createElement("button");

    button.className =
      "tag" + (selectedTag === tag ? " active" : "");

    button.textContent = tag;

    button.onclick = () => {
      selectedTag = tag;
      renderTags();
      renderNotes();
    };

    container.appendChild(button);
  });
}

// ========================
// NOTES DISPLAY
// ========================

function renderNotes() {
  const grid = document.getElementById("notesGrid");

  const keyword = document.getElementById("search")
    .value.trim().toLowerCase();

  grid.innerHTML = "";

  const filtered = notes.filter(note => {

    const matchesTag =
      selectedTag === "ALL" ||
      note.tags.includes(selectedTag);

    const searchTarget = [
      note.title,
      note.content,
      ...note.tags
    ].join(" ").toLowerCase();

    const matchesSearch =
      searchTarget.includes(keyword);

    return matchesTag && matchesSearch;
  });

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";

    const symbol = document.createElement("div");
    symbol.className = "symbol";
    symbol.textContent = "📌";

    const message = document.createElement("div");
    message.textContent = "付箋が見つからないよ";

    empty.append(symbol, message);
    grid.appendChild(empty);
    return;
  }

  filtered.sort((a, b) =>
    b.updatedAt - a.updatedAt
  );

  filtered.forEach(note => {

    const card = document.createElement("article");
    card.className = `note ${note.color}`;

    const title = document.createElement("div");
    title.className = "note-title";
    title.textContent = note.title || "無題";

    const content = document.createElement("div");
    content.className = "note-content";
    content.textContent = note.content;

    const tagContainer = document.createElement("div");
    tagContainer.className = "note-tags";

    note.tags.forEach(tag => {
      const span = document.createElement("span");
      span.className = "note-tag";
      span.textContent = "#" + tag;
      tagContainer.appendChild(span);
    });

    const date = document.createElement("div");
    date.className = "note-date";

    date.textContent =
      new Date(note.updatedAt).toLocaleString("ja-JP");

    card.append(
      title,
      content,
      tagContainer,
      date
    );

    // クリックするとプレビュー
    card.onclick = () => openModal(note.id);

    grid.appendChild(card);
  });
}

// ========================
// MODAL OPEN / CLOSE
// ========================

function openModal(id = null) {

  editingId = id;

  const note = notes.find(n => n.id === id);

  originalNote = note
    ? JSON.stringify(note)
    : null;

  document.getElementById("modal")
    .classList.add("open");

  if (note) {
    showPreview(note);
  } else {
    showEditor();
  }
}

function closeModal() {
  document.getElementById("modal")
    .classList.remove("open");

  editingId = null;
  originalNote = null;
}

function cancelEdit() {

  if (editingId !== null) {
    const note = notes.find(n => n.id === editingId);

    if (note) {
      showPreview(note);
      return;
    }
  }

  closeModal();
}

// ========================
// PREVIEW MODE
// ========================

function showPreview(note) {

  document.getElementById("modalTitle")
    .textContent = "付箋のプレビュー";

  const paper = document.getElementById("previewPaper");

  paper.className = `preview-paper ${note.color}`;

  document.getElementById("previewTitle")
    .textContent = note.title || "無題";

  document.getElementById("previewContent")
    .textContent = note.content;

  document.getElementById("previewDate")
    .textContent =
      "作成：" +
      new Date(note.createdAt).toLocaleString("ja-JP") +
      " / 更新：" +
      new Date(note.updatedAt).toLocaleString("ja-JP");

  const tagContainer =
    document.getElementById("previewTags");

  tagContainer.innerHTML = "";

  note.tags.forEach(tag => {

    const span = document.createElement("span");

    span.className = "note-tag";
    span.textContent = "#" + tag;

    tagContainer.appendChild(span);
  });

  document.getElementById("previewArea")
    .style.display = "block";

  document.getElementById("editArea")
    .style.display = "none";
}

// ========================
// EDIT MODE
// ========================

function showEditor() {

  const note = notes.find(n => n.id === editingId);

  document.getElementById("modalTitle")
    .textContent = note ? "edit" : "NEW";

  document.getElementById("previewArea")
    .style.display = "none";

  document.getElementById("editArea")
    .style.display = "block";

  document.getElementById("titleInput").value =
    note?.title || "";

  document.getElementById("contentInput").value =
    note?.content || "";

  document.getElementById("tagsInput").value =
    note?.tags.join(", ") || "";

  selectedColor = note?.color || "yellow";

  document.getElementById("deleteButton")
    .style.display = note ? "block" : "none";

  updateColorButtons();
}

function switchToEdit() {
  showEditor();
}

// ========================
// COLOR
// ========================

function selectColor(color) {

  selectedColor = color;

  updateColorButtons();
}

function updateColorButtons() {

  document.querySelectorAll(".color-option")
    .forEach(button => {

      button.classList.toggle(
        "selected",
        button.dataset.color === selectedColor
      );

    });
}

// ========================
// SAVE
// ========================

function saveNote() {

  const title = document.getElementById("titleInput")
    .value.trim();

  const content = document.getElementById("contentInput")
    .value.trim();

  const tags = [
    ...new Set(
      document.getElementById("tagsInput")
        .value
        .split(/[,、]/)
        .map(tag => tag.trim())
        .filter(Boolean)
    )
  ];

  if (!title && !content) {
    alert("titleかcontentを入力してね！");
    return;
  }

  const now = Date.now();

  if (editingId !== null) {

    const note = notes.find(n => n.id === editingId);

    if (!note) return;

    note.title = title;
    note.content = content;
    note.tags = tags;
    note.color = selectedColor;
    note.updatedAt = now;

    saveData();
    renderAll();

    originalNote = JSON.stringify(note);

    showPreview(note);

  } else {

    const note = {
      id: crypto.randomUUID
        ? crypto.randomUUID()
        : String(now) + Math.random(),

      title,
      content,
      tags,
      color: selectedColor,
      createdAt: now,
      updatedAt: now
    };

    notes.push(note);

    editingId = note.id;
    originalNote = JSON.stringify(note);

    saveData();
    renderAll();

    showPreview(note);
  }

}

// ========================
// RENDER ALL
// ========================

function renderAll() {
  renderTags();
  renderNotes();
}

// ========================
// KEYBOARD / BACKDROP
// ========================

document.getElementById("modal").addEventListener(
  "click",
  event => {
    if (event.target.id === "modal") {
      closeModal();
    }
  }
);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
  }
});

// ========================
// START
// ========================

renderAll();

</script>

</body>
</html>
